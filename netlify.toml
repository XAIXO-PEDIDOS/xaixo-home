# Redirige la forma con .html a la URL limpia (la que usan canonical,
# sitemap.xml y los enlaces internos) para evitar contenido duplicado.
# force = true porque el archivo .html existe realmente en dist/ y, si no,
# Netlify lo serviría en vez de aplicar la redirección.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/azulejos.html"
  to = "/azulejos"
  status = 301
  force = true

